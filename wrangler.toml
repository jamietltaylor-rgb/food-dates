name = "food-dates"
main = "worker.js"
compatibility_date = "2026-11-01"
keep_vars = true

routes = [{ pattern = "food.jamietaylor.org", custom_domain = true }]

[triggers]
crons = ["0 8 * * *"]   # every day at 8am UTC

[[kv_namespaces]]
binding = "FOOD"
id = "3112216cc5084db281f5a921e3c25fdb"

# Email binding is added once Cloudflare email is switched on (see README)
# [[send_email]]
# name = "MAILER"

[vars]
FROM_EMAIL = "food@jamietaylor.org"
TO_EMAIL = "jamietltaylor@talktalk.net"
# PASSWORD is a secret set in the Cloudflare dashboard

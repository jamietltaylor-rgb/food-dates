name = "food-dates"
main = "worker.js"
compatibility_date = "2026-11-01"
keep_vars = true

routes = [{ pattern = "food.jamietaylor.org", custom_domain = true }]

[triggers]
crons = ["0 8 * * *"]   # every day at 8am UTC

[[kv_namespaces]]
binding = "FOOD"
id = "3112216cc5084db281f5a921e3c25fdb"

# Emails are sent with Resend (secret RESEND_KEY) from alerts.jamietaylor.org
# [[send_email]]
# name = "MAILER"

[vars]
FROM_EMAIL = "food@alerts.jamietaylor.org"
# RESEND_KEY is a secret set in the Cloudflare dashboard
